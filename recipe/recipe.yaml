schema_version: 1

context:
  build_number: 0
  version: 1.33.0

package:
  name: python-cudnn-frontend
  version: ${{ version }}

source:
  url: https://github.com/NVIDIA/cudnn-frontend/archive/v${{ version }}.tar.gz
  sha256: 135a2c56c91dc6b1eca6a75369a0c8c8a3747da95c099be31b4f2a9788f91ce6

build:
  number: ${{ build_number }}
  string: cuda${{ cuda_compiler_version | replace('.', '') }}_py${{ python | version_to_buildstring }}_h${{ hash }}_${{ build_number }}
  skip: (is_abi3 and not is_python_min) or cuda_compiler_version in (undefined, "None") or (not linux)
  script:
    env:
      CUDNN_FRONTEND_LOG_INFO: '1'
      CUDNN_FRONTEND_PYTHON_STABLE_ABI: 'ON'
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    version_independent: ${{ is_abi3 }}

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - ${{ stdlib("c") }}
    - cmake >=3.26
    - cuda-nvrtc-dev
    - make
    - ninja >=1.11.1.1
  host:
    - cudnn
    - nanobind >=3.0.1,<4
    - pip
    - python ${{ python_min }}.*
    - if: is_abi3
      then: python-abi3 ${{ python_min }}.*
    - setuptools >=64
  run:
    - apache-tvm-ffi >=0.1.11
    - python >=${{ python_min }}
    - nvidia-cutlass-dsl >=4.8.0
tests:
  - python:
      imports:
        - cudnn
        - cudnn.block_sparse_attention
        - cudnn.experimental.ops
        - cudnn.gemm
        # - cudnn.gnn
        # - cudnn.gnn.agg_simple
        - cudnn.hstu
        # - cudnn.hstu_attention
        # - cudnn.jax
        - cudnn.linear_attention
        # - cudnn.fla
        # - cudnn.native_sparse_attention
        # - cudnn.native_sparse_attention.compression
        # - cudnn.native_sparse_attention.selection
        # - cudnn.native_sparse_attention.sliding_window_attention
        # - cudnn.native_sparse_attention.top_k
        - cudnn.ops
        # - cudnn.ops.causal_conv1d
        # - cudnn.ops.fft_causal_conv1d
        - cudnn.sdpa
      pip_check: true
      python_version:
        - if: is_abi3
          then: ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - if: is_abi3
          then: abi3audit
    script:
      - python -c "import cudnn; assert cudnn.backend_version() >= 92600, cudnn.backend_version()"
      - if: is_abi3
        then: abi3audit $SP_DIR/cudnn/_compiled_module.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
  - package_contents:
      strict: false
      site_packages:
        - include/cudnn_frontend.h
        - include/cudnn_frontend_version.h


about:
  summary: cuDNN FrontEnd API
  license: MIT
  license_file:
    - LICENSE.txt
    - include/cudnn_frontend/thirdparty/nlohmann/LICENSE.MIT
  homepage: https://github.com/NVIDIA/cudnn-frontend

extra:
  recipe-maintainers:
    - jameslamb
    - weiji14
