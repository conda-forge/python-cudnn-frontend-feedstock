schema_version: 1

context:
  build_number: 1
  version: "1.27.0"

package:
  name: python-cudnn-frontend
  version: ${{ version }}

source:
  url: https://github.com/NVIDIA/cudnn-frontend/archive/v${{ version }}.tar.gz
  sha256: 7a3386b516fc8c0ba047b912272ecbbd3185e66154c512f8f635072a9c9611de

build:
  number: ${{ build_number }}
  string: cuda${{ cuda_compiler_version | replace('.', '') }}_py${{ python | version_to_buildstring }}_h${{ hash }}_${{ build_number }}
  skip: cuda_compiler_version in (undefined, "None") or (not linux)
  script:
    env:
      CUDNN_FRONTEND_LOG_INFO: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - ${{ stdlib("c") }}
    - cmake >=3.18
    - make
    - ninja >=1.11.1.1
  host:
    - cuda-nvrtc-dev
    - cudnn
    - pip
    - pybind11 >=2.13,<3
    - python
    - setuptools >=64
  run:
    - python

tests:
  - python:
      imports:
        - cudnn
        # - cudnn.gemm_swiglu
        # - cudnn.gemm_amax
        # - cudnn.grouped_gemm
        # - cudnn.grouped_gemm.grouped_gemm_swiglu
        # - cudnn.native_sparse_attention
        # - cudnn.native_sparse_attention.compression
        # - cudnn.native_sparse_attention.selection
        # - cudnn.native_sparse_attention.sliding_window_attention
        # - cudnn.native_sparse_attention.top_k
      pip_check: true
  - requirements:
      run:
        - pip
        # - nvidia-cutlass-dsl==4.3.5
    script:
      - python -c "import cudnn; assert cudnn.backend_version() >= 91000, cudnn.backend_version()"
  - package_contents:
      strict: false
      site_packages:
        - include/cudnn_frontend.h
        - include/cudnn_frontend_version.h


about:
  summary: cuDNN FrontEnd API
  license: MIT
  license_file:
    - LICENSE.txt
    - include/cudnn_frontend/thirdparty/nlohmann/LICENSE.MIT
  homepage: https://github.com/NVIDIA/cudnn-frontend

extra:
  recipe-maintainers:
    - jameslamb
    - weiji14
